<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản đồ và tọa độ 34 tỉnh thành</title>
<style>
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
[data-province-map]{width:100%;height:100%;min-height:0}
.map-cursor{position:fixed;z-index:10;width:22px;height:22px;border:1px solid #ffbe00;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);opacity:0}
.map-cursor::after{content:'';position:absolute;inset:8px;border-radius:50%;background:#da251d}
@media(pointer:coarse){.map-cursor{display:none}}
</style>
</head>
<body>
<div data-province-map></div>
<div class="map-cursor" id="map-cursor" aria-hidden="true"></div>
<script src="province-map.js"></script>
</body>
</html>
